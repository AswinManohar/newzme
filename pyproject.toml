[project]
name = "newzme"
version = "0.1.0"
description = "extract news for personalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.6.0",
    "beautifulsoup4==4.12.2",
    "feedparser==6.0.10",
    "ipykernel>=6.29.5",
    "lxml==4.9.3",
    "nltk>=3.9.1",
    "ollama>=0.4.7",
    "pandas>=2.2.3",
    "pycountry>=24.6.1",
    "python-dateutil==2.8.2",
    "readability-lxml==0.8.1",
    "requests==2.31.0",
    "tiktoken>=0.9.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

